[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "oracle-azure-migrate"
version = "1.0.0"
description = "Oracle to Azure SQL Database custom type-mapping demo"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Oracle to Azure SQL Migration Demo contributors" }]
dependencies = [
  "azure-identity>=1.19,<2",
  "oracledb>=2.5,<4",
  "pyodbc>=5.2,<6",
  "PyYAML>=6.0,<7",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9",
  "ruff>=0.9,<1",
]

[project.scripts]
oracle-azure-migrate = "oracle_azure_migrate.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/oracle_azure_migrate"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

